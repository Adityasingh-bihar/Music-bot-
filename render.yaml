services:
  - type: web
    name: melody-music
    env: docker
    region: oregon
    plan: free
    autoDeploy: false
    healthCheckPath: /
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: MONGO_DB_URI
        sync: false
      - key: STRING_SESSION
        sync: false
      - key: OWNER_ID
        sync: false
      - key: LOG_GROUP_ID
        sync: false
      - key: MONGO_DB_NAME
        value: "Melody"
      - key: REDIS_URI
        sync: false
      - key: WEB_SERVICE
        value: "True"
      - key: PORT
        value: "8000"